
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register as a member of the College Coding Club.">
    <title>Registration | College Coding Club</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <header>
        <h1>Club Registration Form</h1>
        <p>Become a member of the College Coding Club</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="registration.html">Registration</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <hr>

    <main>
        <h2>Student Information</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="roll">Roll Number:</label><br>
            <input type="text" id="roll" name="roll"
                   placeholder="Enter your roll number" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>
            <br><br>

            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
                <option value="">Select your course</option>
                <option value="BCA">BCA</option>
                <option value="BTech">B.Tech</option>
                <option value="BSc">B.Sc.</option>
                <option value="MCA">MCA</option>
                <option value="Other">Other</option>
            </select>
            <br><br>

            <label for="year">Year of Study:</label><br>
            <select id="year" name="year" required>
                <option value="">Select year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <br><br>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <p>Areas of Interest:</p>
            <input type="checkbox" id="web" name="interest" value="Web Development">
            <label for="web">Web Development</label><br>

            <input type="checkbox" id="python" name="interest" value="Python">
            <label for="python">Python Programming</label><br>

            <input type="checkbox" id="ai" name="interest" value="AI">
            <label for="ai">Artificial Intelligence</label><br>

            <input type="checkbox" id="cyber" name="interest" value="Cybersecurity">
            <label for="cyber">Cybersecurity</label>
            <br><br>

            <label for="reason">Why do you want to join?</label><br>
            <textarea id="reason" name="reason" rows="4" cols="40"
                      placeholder="Write a few lines about yourself"></textarea>
            <br><br>

            <input type="checkbox" id="confirm" name="confirm"
                   value="yes" required>
            <label for="confirm">
                I confirm that the information provided is correct.
            </label>
            <br><br>

            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Form</button>

        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 College Coding Club. All rights reserved.</p>
    </footer>

</body>
</html>
